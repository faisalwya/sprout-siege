<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Placement Lab</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{height:100%;overflow:hidden;position:fixed;inset:0;background:#12150f;overscroll-behavior:none}
  body{display:flex;align-items:center;justify-content:center;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#fff6e5;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    touch-action:none}
  #stage{position:relative;line-height:0}
  canvas{display:block;image-rendering:pixelated;touch-action:none}
  #ui{position:absolute;inset:0;line-height:1.3;pointer-events:none;font-size:var(--fs)}
  #ui button{font:inherit;color:inherit;pointer-events:auto;cursor:pointer;border:0}

  #top{position:absolute;top:0;left:0;right:0;display:flex;gap:.3em;padding:.4em .5em;align-items:flex-start;flex-wrap:wrap}
  .grp{display:flex;gap:.2em;background:rgba(18,22,18,.78);border:1px solid rgba(255,246,229,.16);
       border-radius:.45em;padding:.2em}
  .grp .lbl{font-size:.6em;color:#9fb09b;padding:.25em .3em;letter-spacing:.08em;align-self:center}
  .opt{background:transparent;border-radius:.3em;padding:.25em .45em;font-size:.72em;letter-spacing:.04em;color:#c2cfbe}
  .opt.on{background:#4f9d4a;color:#fff;font-weight:700}
  .opt:active{transform:translateY(1px)}

  #hint{position:absolute;left:.5em;right:.5em;top:3.6em;font-size:.68em;color:#cfe0ca;
        background:rgba(18,22,18,.72);border-left:2px solid #ffd452;padding:.3em .5em;border-radius:.2em;
        max-width:34em}

  #bottom{position:absolute;left:0;right:0;bottom:0;display:flex;gap:.35em;padding:.45em .5em;align-items:flex-end}
  .card{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:.05em;
    background:rgba(24,28,24,.8);border:1px solid rgba(255,246,229,.2);border-radius:.5em;
    padding:.25em .3em .2em;min-width:4.2em;touch-action:none}
  .card canvas{width:2.1em;height:2.1em;image-rendering:pixelated;pointer-events:none}
  .card .nm{font-size:.6em;letter-spacing:.04em;color:#c2cfbe;white-space:nowrap}
  .card.sel{border-color:#ffd452;background:rgba(60,52,20,.9);box-shadow:0 0 0 2px rgba(255,212,82,.35)}
  .card.drag{opacity:.45}

  #confirm{position:absolute;right:.5em;bottom:.5em;pointer-events:auto;display:flex;gap:.35em;align-items:center;
    background:rgba(18,22,18,.95);border:1px solid rgba(255,246,229,.25);border-radius:.55em;padding:.4em .45em;
    box-shadow:0 5px 14px rgba(0,0,0,.5)}
  #confirm.hide{display:none}
  #confirm .t{font-size:.72em;color:#c9d6c4}
  .btn{background:#4f9d4a;border:1px solid #82d17c!important;border-radius:.45em;padding:.35em .6em;
       box-shadow:0 3px 0 #2c5c2a;font-size:.8em;font-weight:700;white-space:nowrap}
  .btn.no{background:#3a3f3a;border-color:#6a706a!important;box-shadow:0 3px 0 #23261f}
  .btn:active{transform:translateY(2px)}

  #undo{position:absolute;left:50%;bottom:.5em;transform:translateX(-50%);pointer-events:auto;
    background:rgba(18,22,18,.95);border:1px solid #e2c06a;border-radius:.55em;padding:.35em .5em;
    display:flex;gap:.45em;align-items:center;font-size:.75em}
  #undo.hide{display:none}
  #undo .bar{height:2px;background:#e2c06a;width:3em;transition:width .1s linear}

  #count{position:absolute;right:.5em;top:.4em;font-size:.7em;color:#9fb09b}
  #rotate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
    gap:.6em;background:#12150f;z-index:50;text-align:center;padding:2em;font-size:14px}
  @media (orientation:portrait){#rotate{display:flex}#stage{visibility:hidden}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="ui">
    <div id="top">
      <div class="grp"><span class="lbl">MODE</span>
        <button class="opt" data-mode="A">A confirm</button>
        <button class="opt" data-mode="B">B drag</button>
        <button class="opt" data-mode="C">C tap+undo</button>
        <button class="opt" data-mode="D">D split</button>
      </div>
      <div class="grp"><span class="lbl">RETICLE</span>
        <button class="opt" data-ret="ticks">ticks</button>
        <button class="opt" data-ret="vines">vines</button>
        <button class="opt" data-ret="sprouts">sprouts</button>
        <button class="opt" data-ret="twine">twine</button>
        <button class="opt" data-ret="fireflies">fireflies</button>
      </div>
      <div class="grp"><span class="lbl">OPT</span>
        <button class="opt" id="oSticky">sticky</button>
        <button class="opt" id="oClear">clear</button>
      </div>
    </div>
    <div id="hint"></div>
    <div id="bottom">
      <div id="dock" style="display:flex;gap:.35em"></div>
    </div>
    <div id="confirm" class="hide"></div>
    <div id="undo" class="hide"></div>
  </div>
</div>
<div id="rotate"><div style="font-size:2em">&#128241;</div><div>Turn your phone sideways</div></div>

<script>
(function(){
'use strict';
const TILE=16, COLS=20, ROWS=9, W=COLS*TILE, H=ROWS*TILE;

/* ---------------- sprites ---------------- */
const PAL={'.':null,k:'#17141f',w:'#ffffff',W:'#ffeedd',s:'#f6c9a0',r:'#e0524f',R:'#9e2f34',
  g:'#6cc16b',G:'#3d8a4d',b:'#59b0e6',B:'#2f6fae',y:'#ffd452',Y:'#c98f2b',n:'#a97a4f',N:'#6b4a30',
  c:'#cfd3e0',C:'#8d92a8',i:'#a8ecff'};
function mkSprite(rows){
  const w=rows[0].length,h=rows.length,cn=document.createElement('canvas');
  cn.width=w;cn.height=h;const x=cn.getContext('2d');
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const col=PAL[rows[j][i]];if(col){x.fillStyle=col;x.fillRect(i,j,1,1);}}
  return cn;
}
const ART={};
ART.gnome=mkSprite([
"................","................",".......rr.......","......rrrr......",
"......rRRr......",".....rrRRrr.....","....rrRRRRrr....","...rrrrrrrrrr...",
".....ssssss.....",".....skssks.....",".....wwwwww.....","....wwwwwwww....",
"....bwwwwwwb....","....bbwwwwbb....","...nnnnnnnnnn...","...NNNNNNNNNN..."]);
ART.sprink=mkSprite([
"................","................","......cccc......",".....bCccCb.....",
".....cccccc.....","......cCCc......","......cCCc......","......cccc......",
"......cCCc......","......cCCc......","......cCCc......",".....CccccC.....",
"....ccCCCCcc....","...cccccccccc...","...nnnnnnnnnn...","...NNNNNNNNNN..."]);

const TOWERS={
  gnome :{name:'GNOME',   art:'gnome',  rng:46},
  sprink:{name:'SPRINKLER',art:'sprink',rng:56}
};
const FAMS=['gnome','sprink'];

/* ---------------- map ---------------- */
const WP=[[-2,4],[3,4],[3,1],[8,1],[8,7],[12,7],[12,3],[16,3],[16,6],[21,6]]
  .map(p=>({x:(p[0]+.5)*TILE,y:(p[1]+.5)*TILE}));
const SEG=[];
for(let i=0;i<WP.length-1;i++){
  const a=WP[i],b=WP[i+1],dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);
  SEG.push({a,dx:dx/len,dy:dy/len,len});
}
function distToPath(px,py){
  let best=1e9;
  for(const s of SEG){
    let t=(px-s.a.x)*s.dx+(py-s.a.y)*s.dy; t=t<0?0:(t>s.len?s.len:t);
    const ex=px-(s.a.x+s.dx*t), ey=py-(s.a.y+s.dy*t), d=ex*ex+ey*ey;
    if(d<best) best=d;
  }
  return Math.sqrt(best);
}
const BUILD=[];
for(let r=0;r<ROWS;r++){BUILD[r]=[];
  for(let c=0;c<COLS;c++){
    const cx=(c+.5)*TILE, cy=(r+.5)*TILE;
    BUILD[r][c] = r>=1&&r<=7&&c<=17&&distToPath(cx,cy)>11.5 && !(c>=17&&r>=4&&r<=7);
  }
}

/* ---------------- background ---------------- */
let seed=99;
function rnd(){ seed=(seed*1664525+1013904223)&0x7fffffff; return seed/0x7fffffff; }
const bg=document.createElement('canvas'); bg.width=W; bg.height=H;
function disc(q,cx,cy,r,col){
  q.fillStyle=col;
  for(let py=Math.floor(cy-r);py<=Math.ceil(cy+r);py++){
    const dy=py+.5-cy,k=r*r-dy*dy; if(k<0) continue;
    const hw=Math.sqrt(k),x0=Math.round(cx-hw),x1=Math.round(cx+hw);
    if(x1>x0) q.fillRect(x0,py,x1-x0,1);
  }
}
(function paint(){
  const q=bg.getContext('2d');
  q.fillStyle='#6cc16b'; q.fillRect(0,0,W,H);
  for(let i=0;i<20;i++) disc(q,rnd()*W,rnd()*H,10+rnd()*14,'#66bb66');
  for(let i=0;i<10;i++) disc(q,rnd()*W,rnd()*H,7+rnd()*9,'#5cb25d');
  for(let i=0;i<5;i++)  disc(q,rnd()*W,rnd()*H,6+rnd()*8,'#7fd07c');
  for(let i=0;i<320;i++){
    const px=Math.floor(rnd()*W),py=Math.floor(rnd()*H);
    if(distToPath(px,py)<10) continue;
    const k=rnd();
    q.fillStyle = k<.5?'#5cb25d':(k<.8?'#7fd07c':'#3d8a4d');
    q.fillRect(px,py,1,k<.8?1:2);
  }
  for(let c=0;c<W;c+=5){
    for(let i=0;i<3;i++) disc(q,c+rnd()*6,rnd()*9,2.6,i?'#2f6f3c':'#3d8a4d');
    for(let i=0;i<3;i++) disc(q,c+rnd()*6,H-1-rnd()*9,2.6,i?'#2f6f3c':'#3d8a4d');
  }
  const pts=[];
  for(const s of SEG) for(let t=0;t<s.len;t+=2) pts.push({x:s.a.x+s.dx*t,y:s.a.y+s.dy*t});
  pts.forEach((p,i)=>disc(q,p.x,p.y,7.6+Math.sin(i*.09)*.8,'#8f6a44'));
  pts.forEach((p,i)=>disc(q,p.x,p.y,6.1+Math.sin(i*.09)*.8,'#c9a06a'));
  for(let i=0;i<260;i++){
    const p=pts[Math.floor(rnd()*pts.length)];
    q.fillStyle=rnd()<.5?'#b58f60':'#dcb787';
    q.fillRect(Math.round(p.x+(rnd()*2-1)*5),Math.round(p.y+(rnd()*2-1)*5),1,1);
  }
  q.fillStyle='#8a6242'; q.fillRect(17*TILE+6,4*TILE+2,3*TILE,4*TILE-4);
  [[18.2,4.6],[19.1,5.0],[18.4,7.2],[19.3,7.5],[18.0,5.6]].forEach(cr=>{
    const px=Math.round(cr[0]*TILE),py=Math.round(cr[1]*TILE);
    q.fillStyle='#3d8a4d'; q.fillRect(px-1,py-4,1,3); q.fillRect(px+1,py-4,1,3);
    q.fillStyle='#ff9a3c'; q.fillRect(px-1,py,3,2); q.fillRect(px,py+2,1,2);
  });
})();

/* ---------------- state ---------------- */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
cv.width=W; cv.height=H; ctx.imageSmoothingEnabled=false;

const S={
  mode:'A', ret:'vines', sticky:false,
  placing:null, ghost:null, hover:null, hoverAge:0,
  drag:null,            // {fam, x, y, touch}
  towers:[], placed:0,
  undo:null, time:0
};

/* ---------------- reticles ---------------- */
// every reticle gets (cx,cy) tile centre, age in seconds since the cell changed,
// and ok=false when the cell is blocked
function reticle(style,cx,cy,age,ok){
  const col = ok?'#ffeedd':'#e0524f';
  const accent = ok?'#8fdc8b':'#9e2f34';
  const grow = Math.min(1,age*7);                 // quick grow-in on cell change
  const t=S.time;
  const L=TILE/2-1;                               // half extent, inset 1px
  const corners=[[-1,-1],[1,-1],[-1,1],[1,1]];

  if(style==='ticks'){
    ctx.fillStyle=col;
    corners.forEach(([sx,sy])=>{
      const x=Math.round(cx+sx*L), y=Math.round(cy+sy*L);
      const n=Math.max(1,Math.round(3*grow));
      ctx.fillRect(sx<0?x:x-n+1, y, n,1);
      ctx.fillRect(x, sy<0?y:y-n+1, 1,n);
    });
    return;
  }

  if(style==='vines'){
    // a tendril curls inward from each corner, with a leaf that sways
    corners.forEach(([sx,sy],ci)=>{
      const bx=cx+sx*L, by=cy+sy*L;
      const steps=Math.round(5*grow);
      for(let i=0;i<steps;i++){
        const f=i/5;
        const curl=Math.sin(f*2.4+t*1.6+ci)*1.3*f;      // tendril bends as it grows
        const x=bx - sx*(i*1.0), y=by - sy*(i*0.55) + curl*sy*0.6;
        ctx.fillStyle = i>3 ? accent : (ok?'#6cc16b':'#e0524f');
        ctx.fillRect(Math.round(x),Math.round(y),1,1);
        if(i===2){ // leaf
          ctx.fillStyle=ok?'#3d8a4d':'#9e2f34';
          ctx.fillRect(Math.round(x-sx),Math.round(y+sy),1,1);
        }
      }
      if(grow>=1){ // bud at the tip, breathing
        const pulse=(Math.sin(t*3+ci)+1)*.5;
        ctx.fillStyle = pulse>.5 ? (ok?'#ffd452':'#ff7b7b') : (ok?'#f58fbf':'#e0524f');
        ctx.fillRect(Math.round(bx-sx*5),Math.round(by-sy*2.7),1,1);
      }
    });
    return;
  }

  if(style==='sprouts'){
    // four seedlings pushing up out of the soil at the corners
    corners.forEach(([sx,sy],ci)=>{
      const bx=Math.round(cx+sx*(L-1)), by=Math.round(cy+sy*(L-1));
      const hgt=Math.max(1,Math.round(4*grow));
      const sway=Math.round(Math.sin(t*2.2+ci*1.7)*1);
      ctx.fillStyle=ok?'#3d8a4d':'#9e2f34';
      for(let i=0;i<hgt;i++) ctx.fillRect(bx+(i>1?sway:0), by-sy*i*(sy<0?-1:1)-(sy<0?0:0)+ (sy<0? i : -i), 1,1);
      if(grow>.6){
        const tipY=by+(sy<0?hgt:-hgt), tipX=bx+sway;
        ctx.fillStyle=ok?'#6cc16b':'#e0524f';
        ctx.fillRect(tipX-1,tipY,1,1); ctx.fillRect(tipX+1,tipY,1,1);
      }
    });
    return;
  }

  if(style==='twine'){
    // a marching dashed rope with a knot at each corner
    const off=Math.floor(t*6)%4;
    ctx.fillStyle=col;
    const span=Math.round((TILE-2)*grow);
    for(let i=0;i<span;i++){
      if(((i+off)%4)<2){
        const x=Math.round(cx-L+i), y0=Math.round(cy-L), y1=Math.round(cy+L);
        ctx.fillRect(x,y0,1,1); ctx.fillRect(x,y1,1,1);
        const y=Math.round(cy-L+i), x0=Math.round(cx-L), x1=Math.round(cx+L);
        ctx.fillRect(x0,y,1,1); ctx.fillRect(x1,y,1,1);
      }
    }
    if(grow>=1){
      ctx.fillStyle=ok?'#c98f2b':'#9e2f34';
      corners.forEach(([sx,sy])=>{
        ctx.fillRect(Math.round(cx+sx*L)-(sx>0?1:0),Math.round(cy+sy*L)-(sy>0?1:0),2,2);
      });
    }
    return;
  }

  if(style==='fireflies'){
    // motes orbiting the tile edge
    const n=8;
    for(let i=0;i<n;i++){
      const f=((i/n)+t*0.22)%1;
      const per=f*4, side=Math.floor(per), u=(per-side)*2-1;
      let x,y;
      if(side===0){x=cx+u*L;y=cy-L;} else if(side===1){x=cx+L;y=cy+u*L;}
      else if(side===2){x=cx-u*L;y=cy+L;} else {x=cx-L;y=cy-u*L;}
      const tw=(Math.sin(t*5+i*2)+1)*.5;
      ctx.globalAlpha=(0.35+tw*0.65)*grow;
      ctx.fillStyle = tw>.6 ? (ok?'#ffd452':'#ff7b7b') : col;
      ctx.fillRect(Math.round(x),Math.round(y),1,1);
      ctx.globalAlpha=1;
    }
    return;
  }
}

function ring(cx,cy,rad,color,alpha){
  ctx.fillStyle=color; ctx.globalAlpha=alpha;
  const steps=Math.max(16,Math.floor(rad*2.2));
  for(let i=0;i<steps;i++){
    const a=i/steps*Math.PI*2;
    ctx.fillRect(Math.round(cx+Math.cos(a)*rad),Math.round(cy+Math.sin(a)*rad),1,1);
  }
  ctx.globalAlpha=1;
}
function shadow(x,y,w){
  ctx.fillStyle='rgba(0,0,0,.18)';
  ctx.fillRect(Math.round(x-w/2),Math.round(y),w,1);
  ctx.fillRect(Math.round(x-w/2)+1,Math.round(y)+1,w-2,1);
}

/* ---------------- draw ---------------- */
function draw(){
  ctx.drawImage(bg,0,0);

  // a loose free-cell hint only while dragging in B, so you can see where is legal
  if(S.drag){
    ctx.fillStyle='rgba(255,255,255,.10)';
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      if(!BUILD[r][c]||towerAt(c,r)) continue;
      ctx.fillRect(c*TILE+7,r*TILE+7,2,2);
    }
  }

  S.towers.forEach(t=>{
    shadow(t.x,t.y+7,12);
    ctx.drawImage(ART[TOWERS[t.fam].art],Math.round(t.x-8),Math.round(t.y-9));
  });

  // hover preview (no commitment yet)
  const h=S.hover;
  if(h && !S.ghost && !S.drag){
    const cx=(h.c+.5)*TILE, cy=(h.r+.5)*TILE;
    reticle(S.ret,cx,cy,S.hoverAge,h.ok);
    if(h.ok && S.placing) ring(cx,cy,TOWERS[S.placing].rng,'#ffffff',.30);
  }

  // committed ghost (modes A)
  if(S.ghost){
    const cx=(S.ghost.c+.5)*TILE, cy=(S.ghost.r+.5)*TILE;
    ring(cx,cy,TOWERS[S.placing].rng,'#ffd452',.85);
    reticle(S.ret,cx,cy,S.ghost.age,true);
    ctx.globalAlpha=.6; ctx.drawImage(ART[TOWERS[S.placing].art],Math.round(cx-8),Math.round(cy-9)); ctx.globalAlpha=1;
  }

  // dragging tower follows the pointer (mode B / D-touch)
  if(S.drag){
    const d=S.drag, cell=cellAt(d.x,d.y);
    if(cell&&cell.ok){
      const cx=(cell.c+.5)*TILE, cy=(cell.r+.5)*TILE;
      ring(cx,cy,TOWERS[d.fam].rng,'#ffd452',.8);
      reticle(S.ret,cx,cy,S.hoverAge,true);
      ctx.globalAlpha=.85; ctx.drawImage(ART[TOWERS[d.fam].art],Math.round(cx-8),Math.round(cy-9)); ctx.globalAlpha=1;
    } else {
      ctx.globalAlpha=.5; ctx.drawImage(ART[TOWERS[d.fam].art],Math.round(d.x-8),Math.round(d.y-9)); ctx.globalAlpha=1;
      if(cell){ reticle(S.ret,(cell.c+.5)*TILE,(cell.r+.5)*TILE,S.hoverAge,false); }
    }
  }
}

/* ---------------- helpers ---------------- */
function towerAt(c,r){ return S.towers.find(t=>t.c===c&&t.r===r); }
function cellAt(ax,ay){
  const c=Math.floor(ax/TILE), r=Math.floor(ay/TILE);
  if(r<0||r>=ROWS||c<0||c>=COLS) return null;
  return {c,r,ok:BUILD[r][c]&&!towerAt(c,r)};
}
function toArt(ev){
  const b=cv.getBoundingClientRect();
  return {x:(ev.clientX-b.left)/b.width*W, y:(ev.clientY-b.top)/b.height*H};
}
function build(fam,c,r){
  S.towers.push({fam,c,r,x:(c+.5)*TILE,y:(r+.5)*TILE});
  S.placed++;
  document.getElementById('count').textContent=S.placed+' placed';
  if(!S.sticky){ S.placing=null; }
  S.ghost=null;
  syncUI();
}

/* ---------------- input ---------------- */
let dragging=false;
cv.addEventListener('pointermove',ev=>{
  const p=toArt(ev);
  if(S.drag){ S.drag.x=p.x; S.drag.y=p.y - (S.drag.touch?20:0); return; }
  if(!S.placing){ if(S.hover){S.hover=null;} return; }
  const cell=cellAt(p.x,p.y);
  const same=S.hover&&cell&&S.hover.c===cell.c&&S.hover.r===cell.r;
  if(!same) S.hoverAge=0;
  S.hover=cell;
  if(dragging&&cell&&cell.ok&&S.mode==='A'){ S.ghost={c:cell.c,r:cell.r,age:0}; syncUI(); }
});
cv.addEventListener('pointerleave',()=>{ if(!S.drag) S.hover=null; });

cv.addEventListener('pointerdown',ev=>{
  ev.preventDefault();
  const p=toArt(ev);
  const cell=cellAt(p.x,p.y);
  if(!cell) return;

  // tapping an existing tower removes it, so the lab stays quick to reset
  const ex=towerAt(cell.c,cell.r);
  if(ex && !S.placing){ S.towers=S.towers.filter(t=>t!==ex); syncUI(); return; }
  if(!S.placing) return;
  if(!cell.ok){ S.hover=cell; S.hoverAge=0; return; }

  const mouse = ev.pointerType==='mouse';
  if(S.mode==='A'){ S.ghost={c:cell.c,r:cell.r,age:0}; dragging=true; syncUI(); }
  else if(S.mode==='C'){ placeWithUndo(S.placing,cell.c,cell.r); }
  else if(S.mode==='D'){ if(mouse) build(S.placing,cell.c,cell.r); }
  else if(S.mode==='B'){ /* B builds by dragging off the card */ }
},{passive:false});
window.addEventListener('pointerup',()=>{ dragging=false; });

function placeWithUndo(fam,c,r){
  build(fam,c,r);
  const t=S.towers[S.towers.length-1];
  clearTimeout(S.undoTimer);
  S.undo={t,until:performance.now()+4000};
  syncUI();
  S.undoTimer=setTimeout(()=>{ S.undo=null; syncUI(); },4000);
}

/* ---- drag off the dock card (modes B and D-on-touch) ---- */
function startCardDrag(fam,ev){
  const touch = ev.pointerType!=='mouse';
  const p=toArt(ev);
  S.drag={fam,x:p.x,y:p.y-(touch?20:0),touch};
  S.placing=fam; S.hoverAge=0;
  syncUI();
  const move=e=>{ const q=toArt(e); S.drag.x=q.x; S.drag.y=q.y-(touch?20:0); };
  const up=e=>{
    window.removeEventListener('pointermove',move);
    window.removeEventListener('pointerup',up);
    const d=S.drag; S.drag=null;
    if(d){
      const cell=cellAt(d.x,d.y);
      if(cell&&cell.ok) build(d.fam,cell.c,cell.r);
      else { if(!S.sticky) S.placing=null; syncUI(); }
    }
  };
  window.addEventListener('pointermove',move);
  window.addEventListener('pointerup',up);
}

/* ---------------- UI ---------------- */
const dock=document.getElementById('dock');
const confirmEl=document.getElementById('confirm');
const undoEl=document.getElementById('undo');
const hintEl=document.getElementById('hint');

FAMS.forEach(fam=>{
  const F=TOWERS[fam];
  const b=document.createElement('button');
  b.className='card'; b.dataset.fam=fam;
  const ic=document.createElement('canvas'); ic.width=16;ic.height=16;
  ic.getContext('2d').drawImage(ART[F.art],0,0);
  const nm=document.createElement('div'); nm.className='nm'; nm.textContent=F.name;
  b.appendChild(ic); b.appendChild(nm);
  b.addEventListener('pointerdown',ev=>{
    ev.preventDefault();
    const mouse=ev.pointerType==='mouse';
    const dragMode = S.mode==='B' || (S.mode==='D' && !mouse);
    if(dragMode){ startCardDrag(fam,ev); return; }
    S.placing = S.placing===fam ? null : fam;
    S.ghost=null; S.hover=null; syncUI();
  });
  dock.appendChild(b);
});

const HINTS={
  A:'MODE A — tap a card, tap a plot, then confirm in the corner. Three taps, and the confirm sits far from the plot.',
  B:'MODE B — press and drag a card onto the map. Release to build, release off-map to cancel. One gesture, no confirm.',
  C:'MODE C — tap a card then tap a plot; it builds instantly. UNDO appears for 4s as the safety net.',
  D:'MODE D — mouse: hover to preview, click to build. Touch: drag off the card. Each input gets its natural gesture.'
};
function syncUI(){
  [...document.querySelectorAll('[data-mode]')].forEach(b=>b.classList.toggle('on',b.dataset.mode===S.mode));
  [...document.querySelectorAll('[data-ret]')].forEach(b=>b.classList.toggle('on',b.dataset.ret===S.ret));
  document.getElementById('oSticky').classList.toggle('on',S.sticky);
  [...dock.children].forEach(b=>{
    b.classList.toggle('sel',S.placing===b.dataset.fam && !S.drag);
    b.classList.toggle('drag',!!S.drag&&S.drag.fam===b.dataset.fam);
  });
  hintEl.textContent=HINTS[S.mode]+(S.sticky?'  [sticky: stays armed after building]':'');

  const showConf = S.mode==='A' && !!S.ghost;
  confirmEl.classList.toggle('hide',!showConf);
  if(showConf){
    confirmEl.innerHTML='<span class="t">'+TOWERS[S.placing].name+'</span>'+
      '<button class="btn" id="cOk">BUILD</button><button class="btn no" id="cNo">&#10005;</button>';
    document.getElementById('cOk').onclick=()=>build(S.placing,S.ghost.c,S.ghost.r);
    document.getElementById('cNo').onclick=()=>{ S.ghost=null; if(!S.sticky) S.placing=null; syncUI(); };
  }

  undoEl.classList.toggle('hide',!S.undo);
  if(S.undo){
    undoEl.innerHTML='<span>built</span><span class="bar"></span><button class="btn no" id="uNo">UNDO</button>';
    document.getElementById('uNo').onclick=()=>{
      S.towers=S.towers.filter(t=>t!==S.undo.t); S.placed--;
      document.getElementById('count').textContent=S.placed+' placed';
      S.undo=null; clearTimeout(S.undoTimer); syncUI();
    };
  }
}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{
  S.mode=b.dataset.mode; S.placing=null; S.ghost=null; S.hover=null; S.drag=null; syncUI();
}));
document.querySelectorAll('[data-ret]').forEach(b=>b.addEventListener('click',()=>{ S.ret=b.dataset.ret; syncUI(); }));
document.getElementById('oSticky').addEventListener('click',()=>{ S.sticky=!S.sticky; syncUI(); });
document.getElementById('oClear').addEventListener('click',()=>{
  S.towers=[]; S.placed=0; S.undo=null; S.ghost=null;
  document.getElementById('count').textContent='0 placed'; syncUI();
});

/* ---------------- layout + loop ---------------- */
const stage=document.getElementById('stage');
function layout(){
  const cs=getComputedStyle(document.body);
  const padX=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);
  const padY=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0);
  const vv=window.visualViewport;
  const vw=(vv?vv.width:window.innerWidth)-padX, vh=(vv?vv.height:window.innerHeight)-padY;
  const dpr=window.devicePixelRatio||1;
  let raw=Math.min(vw/W,vh/H,6);
  const snap=Math.floor(raw*dpr)/dpr;
  const s=(snap>=.5&&snap>=raw*.95)?snap:raw;
  cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
  stage.style.width=(W*s)+'px'; stage.style.height=(H*s)+'px';
  stage.style.setProperty('--fs',Math.max(9,Math.min(17,Math.round(H*s*0.05)))+'px');
}
window.addEventListener('resize',layout);
window.addEventListener('orientationchange',()=>setTimeout(layout,250));
if(window.visualViewport) window.visualViewport.addEventListener('resize',layout);
layout();

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  S.time+=dt; S.hoverAge+=dt;
  if(S.ghost) S.ghost.age+=dt;
  if(S.undo){
    const left=Math.max(0,(S.undo.until-now)/4000);
    const bar=undoEl.querySelector('.bar'); if(bar) bar.style.width=(3*left)+'em';
  }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const cnt=document.createElement('div'); cnt.id='count'; cnt.textContent='0 placed';
document.getElementById('ui').appendChild(cnt);
syncUI();
})();
</script>
</body>
</html>

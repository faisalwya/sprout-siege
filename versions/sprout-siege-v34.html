function hitBtn(ax,ay){
  for(const b of G.btns) if(ax>=b.x-3&&ax<=b.x+b.w+3&&ay>=b.y-3&&ay<=b.y+b.h+3) return b;
  return null;
}

/* ---------------- the placement mark ----------------
   Third attempt, and the first one that is not an object laid over the world.
   Vines lost because they sprouted from exactly where the tower stands. The
   frame lost because it drew a rectangle around something that is not
   rectangular. What marks a spot now is the ground itself being turned over:
   the soil patch grows out of nothing with easeOutBack, a few clods of dirt
   kick up and fall back, and a 1px rim in the patch's own shape says whose
   spot it is. One animation, at the moment of choosing, which is the only
   moment that needed marking. Deliberately small, so it can be built on. */
const SEL_GROW=0.22;
function easeOutBack(t,k){ k=k||1.9; t=t<0?0:(t>1?1:t);
  return 1+(k+1)*Math.pow(t-1,3)+k*Math.pow(t-1,2); }

// six clods thrown up by the dig, on fixed parabolas so they never shimmer
function digSpecks(x,y,age){
  if(age<=0 || age>0.5) return;
  const r=soilRnd(x+7,y+13);
  for(let i=0;i<6;i++){
    const dir = r()<.5 ? -1 : 1;
    const reach = 7+r()*7, up = 4+r()*4, lag = r()*0.06;
    const t=(age-lag)/0.40;
    if(t<=0||t>=1) continue;
    const sx = x + dir*reach*t;
    const sy = y + 3 - (up*4*t*(1-t));            // up, then back down
    ctx.fillStyle = (i%3) ? '#7a5636' : '#9c7048';
    ctx.fillRect(Math.round(sx), Math.round(sy), 1, 1);
  }
}

// P16: grass tufts and a pebble round a tower's feet, drawn in front of it on
// the 2x grid, so the tower stands in the lawn instead of on a patch
const FOOT_CACHE={};
function footing(x,y){
  const key=G.map; let C=FOOT_CACHE[key];
  if(!C){ const g=ramp(MAPS[G.map-1].pal.g1,{h:10,vd:0.20,vl:0.32});
    C=FOOT_CACHE[key]={dk:hexc(mixc(g[0],INK,0.3)), md:hexc(g[0]), lt:hexc(g[4])}; }
  const r=soilRnd(Math.round(x)+3,Math.round(y)+5);
  const spots=[[-6.5,5.6],[6,5.4],[-3,6.6],[3.5,6.8]];
  for(const [sx,sy] of spots){
    if(r()<0.25) continue;
    const bx0=Math.round((x+sx+(r()-0.5))*2)/2, by=Math.round((y+sy)*2)/2;
    for(let b=0;b<3;b++){
      const h=1+Math.floor(r()*3)*0.5, bx=bx0+(b-1)*0.5;
      ctx.fillStyle=b===1?C.dk:C.md; ctx.fillRect(bx,by-h,0.5,h);
      ctx.fillStyle=C.lt; ctx.fillRect(bx,by-h,0.5,0.5);
    }
  }
  if(r()<0.6){ const px=Math.round((x+(r()<0.5?-4.5:4))*2)/2, py=Math.round((y+6.4)*2)/2;
    ctx.fillStyle='#c9c6b8'; ctx.fillRect(px,py,1,0.5); ctx.fillStyle='#8f8b7e'; ctx.fillRect(px,py+0.5,1,0.5); }
}

// mode: 'hover' | 'armed' | 'bad' | 'selected'
function plotMark(cx,cy,age,mode){
  if(age<=0) return;
  const x=Math.round(cx), y=Math.round(cy);
  const g=Math.min(1, easeOutBack(age/SEL_GROW));
  if(mode==='bad'){
    ctx.globalAlpha=.72; drawSoil(x,y,g,'#c0423c',SOIL_BAD,'bad'); ctx.globalAlpha=1;
    return;
  }
  if(mode==='hover'){
    ctx.globalAlpha=.5; drawSoil(x,y,g,'#c9a36a',SOIL_TILLED); ctx.globalAlpha=1;
    return;
  }
  // armed or selected: full soil with a gold rim. Only a fresh dig throws dirt.
  drawSoil(x,y,g,'#ffd452',SOIL_TILLED);
  if(mode==='armed') digSpecks(x,y,age);
}

// grow a 1px outline around the art, so it holds up on any background
// Coloured outline (v34): each outline pixel takes the colour of the sprite
// pixel it wraps, darkened toward INK. Bottom and right edges, away from the
// light, go darker; top and left edges stay lighter. Never black.
function mkOutlined(rows,pal){
  const w=rows[0].length, h=rows.length;
  const c=document.createElement('canvas'); c.width=w+2; c.height=h+2;
  const x=c.getContext('2d');
  const col=(i,j)=> (i>=0&&j>=0&&i<w&&j<h) ? pal[rows[j][i]] : null;
  for(let j=-1;j<=h;j++) for(let i=-1;i<=w;i++){
    if(col(i,j)) continue;
    const dark=col(i,j-1)||col(i-1,j), lit=col(i,j+1)||col(i+1,j);
    if(!dark && !lit) continue;
    const base=rgb3(dark||lit), dk=mixc(base.map(v=>v*0.55),INK,0.45);
    x.fillStyle=hexc(dark ? dk.map(Math.round) : mixc(dk,base,0.3));
    x.fillRect(i+1,j+1,1,1);
  }
  for(let j=0;j<h;j++) for(let i=0;i<w;i++){
    const cc=pal[rows[j][i]];
    if(cc){ x.fillStyle=cc; x.fillRect(i+1,j+1,1,1); }
  }
  return c;
}
function pxLine(x0,y0,x1,y1,col){
  x0=Math.round(x0); y0=Math.round(y0); x1=Math.round(x1); y1=Math.round(y1);
  const dx=Math.abs(x1-x0), sx=x0<x1?1:-1, dy=-Math.abs(y1-y0), sy=y0<y1?1:-1;
  let err=dx+dy;
  ctx.fillStyle=col;
  for(let i=0;i<200;i++){
    ctx.fillRect(x0,y0,1,1);
    if(x0===x1&&y0===y1) break;
    const e2=2*err;
    if(e2>=dy){ err+=dy; x0+=sx; }
    if(e2<=dx){ err+=dx; y0+=sy; }
  }
}
// P5: a flat soft shadow at the feet, a cool dark tint rather than black,
// drawn on the 2x grid so its ends round off
function shadow(x,y,w){
  ctx.fillStyle='rgba(28,60,52,.22)';
  const X=Math.round(x*2)/2, Y=Math.round(y*2)/2, hw=w/2;
  ctx.fillRect(X-hw+1,Y-0.5,w-2,0.5);
  ctx.fillRect(X-hw,Y,w,1);
  ctx.fillRect(X-hw+1,Y+1,w-2,0.5);
}
// P5: petals drifting across the garden, one art pixel each, tumbling
const PETALS=[];
function drawPetals(){
  if(!PETALS.length) for(let i=0;i<14;i++) PETALS.push({x:Math.random()*400, y:Math.random()*200, s:0.25+Math.random()*0.35, ph:Math.random()*6, w:i%3===2});
  const t=performance.now()/1000, SW=W+2*OX+20, SH=H+2*OY+20;
  for(const p of PETALS){
    const a=t*p.s;
    const x=((p.x+a*18+Math.sin(t*0.9+p.ph)*4)%SW+SW)%SW-OX-10;
    const y=((p.y+a*9)%SH+SH)%SH-OY-10;
    ctx.fillStyle=p.w?'#fff4e6':'#f6a9c8';
    const flip=Math.sin(t*3+p.ph)>0;
    ctx.fillRect(Math.round(x*2)/2, Math.round(y*2)/2, flip?1:0.5, 0.5);
  }
}
function drawSprite(key,flip,x,y,w,h){
  const img=(flip===-1?FLIP[key]:ART[key])||ART[key];
  ctx.drawImage(img, Math.round(x-gw(img)/2), Math.round(y-gh(img)/2));
}

function draw(){
  let pending=[];      // in-world buttons, drawn last so nothing covers them
  ctx.setTransform(ART_RES,0,0,ART_RES,0,0);
  ctx.save();
  if(G.shake>0) ctx.translate(Math.round((Math.random()-.5)*G.shake), Math.round((Math.random()-.5)*G.shake));
  ctx.drawImage(BGX||bg,0,0);
  ctx.translate(OX,OY);

  // butterflies (behind everything)
  for(const b of BUTTERFLIES){
    const f=Math.sin(G.time*18+b.x)>0?1:0;
    ctx.fillStyle=b.c;
    ctx.fillRect(Math.round(b.x),Math.round(b.y),1,1);
    ctx.fillRect(Math.round(b.x)-1,Math.round(b.y)-f,1,1);
    ctx.fillRect(Math.round(b.x)+1,Math.round(b.y)-f,1,1);
  }

  drawPlots();
  drawCarrots();

  G.btns=[];

  // placement: the spot under the pointer, then the armed spot with its buttons
  if(G.placing){
    const F=TOWERS[G.placing];
    // what the pointer is over, if it is not already the armed spot
    let hx=null, hy=null, hok=true;
    if(PLACEMENT==='open'){
      const hp=G.hoverPos;
      if(hp && !(G.ghost && G.ghost.x===hp.x && G.ghost.y===hp.y)){
        hx=hp.x; hy=hp.y; hok=hp.ok;
      }
    } else if(G.hover>=0 && !(G.ghost && G.ghost.i===G.hover)){
      hx=G.plots[G.hover].x; hy=G.plots[G.hover].y;
    }
    if(hx!==null){
      if(hok){
        plotMark(hx,hy,G.hoverAge,'hover');
        // with a free position the range matters more before you commit
        ring(hx,hy,F.lv[0].rng,'#ffffff',PLACEMENT==='open'?.45:.28);
      } else {
        plotMark(hx,hy,G.hoverAge,'bad');
      }
    }
    if(G.ghost){
      const cx=G.ghost.x, cy=G.ghost.y;
      ring(cx,cy,F.lv[0].rng,'#ffd452',.85);
      plotMark(cx,cy,G.ghost.age||0,'armed');
      const drop=1-Math.pow(1-Math.min(1,(G.ghost.age||0)/0.18),3);
      ctx.globalAlpha=.55+drop*.3;
      drawSprite(F.art,1,cx,cy+TOWER_DY+Math.round((1-drop)*-4),16,16);
      ctx.globalAlpha=1;
      const bs=layoutBtns(cx,cy,[
        {act:'ok', glyph:'check', side:'right', num:F.cost, dis:G.gold<F.cost},
        {act:'no', glyph:'cross', side:'left'}
      ]);
      G.btns=G.btns.concat(bs); pending=pending.concat(bs);
    }
  }

  if(G.selPlot>=0 && G.plots[G.selPlot] && G.plots[G.selPlot].blocked){
    const pl=G.plots[G.selPlot];
    // the stump is already drawn; this adds the gold rim around it
    plotMark(pl.x,pl.y,G.selAge||0,'selected');
    const bs=layoutBtns(pl.x,pl.y,[
      {act:'clear', glyph:'coin', side:'right', num:CLEAR_COST, dis:G.gold<CLEAR_COST, plot:G.selPlot}
    ]);
    G.btns=G.btns.concat(bs); pending=pending.concat(bs);
  }

  // selected tower: range ring plus its actions, arranged around the plot
  if(G.selected && G.towers.includes(G.selected)){
    const t=G.selected, F=TOWERS[t.fam], st=statsOf(t);
    ring(t.x,t.y,st.rng,'#ffd452',.7);
    // same gold rim as an armed spot, so selection reads the same everywhere
    plotMark(t.x,t.y,G.selAge||0,'selected');
    const sell=Math.floor(t.spent*.6);
    const atFork=!t.branch && t.level===3;
    if(atFork){
      const keys=Object.keys(F.forks);
      const A=F.forks[keys[0]], B=F.forks[keys[1]];
      // tapping anywhere else already deselects, so no close button is needed
      var bs=layoutBtns(t.x,t.y,[
        {act:'forkA', side:'left',  w:20,h:20, sprite:A.art, branch:keys[0], num:A.lv[0].cost, dis:G.gold<A.lv[0].cost},
        {act:'forkB', side:'right', w:20,h:20, sprite:B.art, branch:keys[1], num:B.lv[0].cost, dis:G.gold<B.lv[0].cost},
        {act:'sell',  side:'up',    glyph:'coin', num:sell}
      ]);
    } else {
      const cost=nextCost(t);
      const specs=[{act:'sell', glyph:'coin', side:'left', num:sell}];
      if(cost!==null) specs.unshift({act:'up', glyph:'up', side:'right', num:cost, dis:G.gold<cost});
      var bs=layoutBtns(t.x,t.y,specs);
    }
    G.btns=G.btns.concat(bs); pending=pending.concat(bs);
  }

  // towers
  const sorted=G.towers.slice().sort((a,b)=>a.y-b.y);
  for(const t of sorted){
    const st=statsOf(t);
    // no ground shadow: it stands on a bed now, and the shadow read as extra
    // bed edge underneath, which is what made towers look like they sat high
    const kick=t.kick>0?1:0;
    const bob=Math.round(Math.sin(t.bob*2.2)*0.5);
    drawSprite(artOf(t), (TOWERS[t.fam].flip&&t.face===-1)?-1:1, t.x, t.y+TOWER_DY+bob+kick, 16,16);
    footing(t.x,t.y);
    // level pips ride the bed's bottom frame row, under the tower's feet
    const lv=t.level;
    for(let i=0;i<lv;i++){
      ctx.fillStyle = i>=3 ? '#a8ecff' : '#ffd452';
      ctx.fillRect(Math.round(t.x-lv*1.5+i*3), Math.round(t.y+PIP_Y), 2,1);
    }
    if(st.aura){
      const a=(Math.sin(G.time*3)+1)*.5;
      ring(t.x,t.y,st.rng-1,'#ffd452',.10+a*.10);
    }
  }

  // enemies
  for(const f of G.foes){
    const E=f.E, w=E.boss?16:12;
    const fa=Math.max(0,Math.min(1, f.d/16, (PATH_LEN-f.d)/16));   // trail ends
    ctx.globalAlpha=fa;
    const bob=E.boss?0:Math.round(Math.sin(f.bob)* (f.type==='moth'?1.5:0.6));
    shadow(f.x, f.y+ (E.boss?7:5), E.boss?14:9);
    const fl=(E.flip&&f.face===-1)?-1:1;
    drawSprite(E.art, fl, f.x, f.y-1+bob, w,w);
    if(f.hit>0){
      const img=fl===-1?WHITEF[E.art]:WHITE[E.art];
      ctx.globalAlpha=fa*Math.min(.85,f.hit*6);
      ctx.drawImage(img, Math.round(f.x-w/2), Math.round(f.y-1+bob-w/2));
      ctx.globalAlpha=fa;
    }
    if(f.stunT>0){
      ctx.fillStyle='#ffd452';
      const a=G.time*9;
      ctx.fillRect(Math.round(f.x+Math.cos(a)*4),Math.round(f.y-w/2-3+Math.sin(a)*1.5),1,1);
      ctx.fillRect(Math.round(f.x+Math.cos(a+2.1)*4),Math.round(f.y-w/2-3+Math.sin(a+2.1)*1.5),1,1);
      ctx.fillRect(Math.round(f.x+Math.cos(a+4.2)*4),Math.round(f.y-w/2-3+Math.sin(a+4.2)*1.5),1,1);
    }
    if(f.slow>0){ ctx.fillStyle='rgba(168,236,255,.5)'; ctx.fillRect(Math.round(f.x-3),Math.round(f.y-w/2-3),1,1); ctx.fillRect(Math.round(f.x+2),Math.round(f.y-w/2-4),1,1); }
    // health bar
    if(f.hp<f.max){
      const bw=E.boss?18:11, hp=Math.max(0,f.hp/f.max);
      const bx=Math.round(f.x-bw/2), by=Math.round(f.y-w/2-4);
      ctx.fillStyle='#1c1b24'; ctx.fillRect(bx-1,by-1,bw+2,3);
      ctx.fillStyle=hp>.5?'#6cc16b':(hp>.25?'#ffd452':'#e0524f');
      ctx.fillRect(bx,by,Math.ceil(bw*hp),1);
    }
    ctx.globalAlpha=1;
  }

  // projectiles
  for(const s of G.shots){
    ctx.fillStyle=s.col;
    if(s.kind==='bee'){
      const o=Math.round(Math.sin(s.wob)*1.2);
      ctx.fillRect(Math.round(s.x),Math.round(s.y+o),2,2);
      ctx.fillStyle='rgba(255,255,255,.7)';
      ctx.fillRect(Math.round(s.x)-1,Math.round(s.y+o)-1,1,1);
      ctx.fillRect(Math.round(s.x)+2,Math.round(s.y+o)-1,1,1);
    } else if(s.kind==='drop'){
      ctx.fillRect(Math.round(s.x)-1,Math.round(s.y),3,2);
      ctx.fillRect(Math.round(s.x),Math.round(s.y)-1,1,4);
    } else {
      ctx.fillRect(Math.round(s.x),Math.round(s.y),2,2);
    }
  }

  // effects
  for(const e of G.fx){
    const k=e.life/e.ttl;
    if(e.type==='bit'){ ctx.globalAlpha=1-k; ctx.fillStyle=e.color; ctx.fillRect(Math.round(e.x),Math.round(e.y),1,1); ctx.globalAlpha=1; }
    else if(e.type==='ring'){ ring(e.x,e.y,e.r+(e.rmax-e.r)*k,e.color,1-k); }
    else if(e.type==='eaten'){ drawCarrot(e.x,e.y,1-e.life/e.ttl); }
    else if(e.type==='bolt'){
      ctx.globalAlpha=Math.min(1,(1-k)*2.2);
      for(let i=1;i<e.pts.length;i++) pxLine(e.pts[i-1].x,e.pts[i-1].y+1,e.pts[i].x,e.pts[i].y+1,'#3b8fd4');
      for(let i=1;i<e.pts.length;i++) pxLine(e.pts[i-1].x,e.pts[i-1].y,e.pts[i].x,e.pts[i].y,'#a8ecff');
      if(k<.5) for(let i=1;i<e.pts.length;i+=2) pxLine(e.pts[i-1].x,e.pts[i-1].y,e.pts[i].x,e.pts[i].y,'#ffffff');
      ctx.globalAlpha=1;
    }
    else if(e.type==='txt'){ ctx.globalAlpha=Math.min(1,(1-k)*2); drawText(Math.round(e.x-textW(e.txt)/2),Math.round(e.y),e.txt,e.color); ctx.globalAlpha=1; }
  }

  drawPlaque();
  pending.forEach(drawBtn);

  // dock last so it paints over the field, but appended last so in-world
  // buttons keep hit priority where they overlap
  drawPetals();
  G.btns=G.btns.concat(drawDock());
  G.btns=G.btns.concat(drawHUD());

  if(G.flash>0){ ctx.fillStyle='rgba(224,82,79,'+(G.flash*.28)+')'; ctx.fillRect(-OX,-OY,ARTW,ARTH); }
  if(G.screen) G.btns=drawScreen(G.screen);   // on top of everything, and takes every tap
  ctx.restore();
}

/* ======================================================================
   11. LOOP
   ====================================================================== */
const SHAKE_SETTLE=2;   // shake units per second while paused: 4 settles in 2s
let last=performance.now();
function frame(now){
  const raw=Math.min(.05,(now-last)/1000); last=now;
  G.ui+=raw; G.hoverAge+=raw;
  G.selAge = (G.selPlot>=0 || G.selected) ? (G.selAge||0)+raw : 0;
  if(G.ghost) G.ghost.age=(G.ghost.age||0)+raw;
  if(!G.paused && G.phase!=='dead' && G.phase!=='won'){
    let t=raw*G.speed;
    while(t>0){ const d=Math.min(1/60,t); step(d); t-=d; }
  } else if(!G.paused){ G.time+=raw; }
  // A paused game (a screen is up, or the pause button) runs no step(), so the
  // shake would freeze at whatever the last hit left. Let it settle in real
  // time instead, slowly, so a boss kill still rumbles under the map-cleared
  // screen for a moment and then goes still.
  if(G.paused && G.shake>0) G.shake=Math.max(0,G.shake-raw*SHAKE_SETTLE);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ======================================================================
   12. LAYOUT
   ====================================================================== */
const stage=document.getElementById('stage');
const MAX_SCALE=8;   // sanity ceiling for very large displays only; normally never reached

function applyPad(vw,vh){
  const want=vw/vh, px0=OX, py0=OY;
  let px=0, py=0;
  if(want > W/H) px=Math.min(MAX_PAD_X, Math.round((H*want-W)/2));
  else           py=Math.min(MAX_PAD_Y, Math.round((W/want-H)/2));
  if(px===px0 && py===py0 && cv.width===ARTW*ART_RES) return false;
  OX=px; OY=py; ARTW=W+2*px; ARTH=H+2*py;
  cv.width=ARTW*ART_RES; cv.height=ARTH*ART_RES;   // resizing clears context state
  ctx.imageSmoothingEnabled=false;
  bg.width=ARTW; bg.height=ARTH;
  seed=1337+G.map*7919;
  paintBG(curPal);
  return true;
}

function layout(){
  const cs=getComputedStyle(document.body);
  const padX=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);
  const padY=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0);
  const vv=window.visualViewport;
  const vw=(vv?vv.width:window.innerWidth)-padX;
  const vh=(vv?vv.height:window.innerHeight)-padY;
  const dpr=window.devicePixelRatio||1;
  applyPad(Math.max(1,vw), Math.max(1,vh));

  // Fit, then cap.
  let raw=Math.min(vw/ARTW, vh/ARTH, MAX_SCALE);

  // Snap so one art pixel covers a whole number of DEVICE pixels; that is what
  // keeps the edges hard. Size beats crispness though, so only take the snap when
  // it is nearly free (within 5%). On a 2x display the snap costs ~2% and is taken;
  // on a 3x phone it would cost 12%, so we fill and let the unevenness go unnoticed
  // at that density.
  const snapped=Math.floor(raw*dpr)/dpr;
  const s=(snapped>=0.5 && snapped>=raw*0.95) ? snapped : raw;

  const cw=ARTW*s, ch=ARTH*s;
  cv.style.width=cw+'px'; cv.style.height=ch+'px';
  stage.style.width=cw+'px'; stage.style.height=ch+'px';
  document.body.classList.toggle('framed', vw-cw>90 && vh-ch>60);
}
window.addEventListener('resize',layout);
window.addEventListener('orientationchange',()=>setTimeout(layout,250));
if(window.visualViewport) window.visualViewport.addEventListener('resize',layout);
layout();

/* ======================================================================
   13. INPUT
   ====================================================================== */
function toArt(ev){
  const r=cv.getBoundingClientRect();
  return { x:(ev.clientX-r.left)/r.width*ARTW-OX, y:(ev.clientY-r.top)/r.height*ARTH-OY };
}

function doAction(b){
  if(b.act==='hud_sound'){ sndOn=!sndOn; SFX.tick(); return; }
  if(b.act==='hud_speed'){ G.speed = G.speed===1?2:(G.speed===2?3:1); SFX.tick(); return; }
  if(b.act==='hud_action'){
    const st=actionState();
    if(st==='send') startWave(); else G.paused=(st==='pause');
    return;
  }
  if(b.act==='card'){
    const F=TOWERS[b.fam];
    if(G.placing===b.fam){ cancelPlacing(); return; }
    if(G.gold<F.cost){ toast('Not enough coins'); SFX.bad(); return; }
    G.placing=b.fam; G.ghost=null; G.hover=-1; G.hoverPos=null; G.hoverAge=0; G.selected=null;
    toast(PLACEMENT==='open' ? 'Tap the ground to preview' : 'Tap a plot to preview');
    SFX.tick(); return;
  }
  if(b.act==='ok'){ placeGhost(); return; }
  if(b.act==='no'){ cancelPlacing(); return; }   // cross leaves build mode entirely
  if(b.act==='clear'){
    if(G.gold<CLEAR_COST){ toast('Not enough coins'); SFX.bad(); return; }
    const pl=G.plots[b.plot];
    G.gold-=CLEAR_COST; pl.blocked=false; G.selPlot=-1;
    G.shake=3; SFX.up();
    addFx({type:'ring',x:pl.x,y:pl.y,r:2,rmax:18,ttl:.45,color:'#a97a4f'});
    for(let k=0;k<8;k++) addFx({type:'bit',x:pl.x,y:pl.y,
      vx:(Math.random()-.5)*40, vy:-14-Math.random()*20, ttl:.5, color:k<5?'#8a6242':'#5c4433'});
    return;
  }
  const t=G.selected;
  if(!t||!G.towers.includes(t)) return;
  if(b.act==='sell'){
    const val=Math.floor(t.spent*.6);
    if(G.plots[t.plot]) G.plots[t.plot].tower=null;
    if(PLACEMENT==='open'){      // the bed goes with it, and later plots shift down
      const gi=t.plot;
      G.plots.splice(gi,1);
      for(const o of G.towers) if(o.plot>gi) o.plot--;
    }
    G.gold+=val; G.towers=G.towers.filter(x=>x!==t); G.selected=null;
    addFx({type:'txt',x:t.x,y:t.y-6,txt:'+'+val,color:'#ffd452',ttl:.9,vy:-16});
    SFX.coin(); return;
  }
  if(b.act==='up'){
    const cost=nextCost(t);
    if(cost===null) return;
    if(G.gold<cost){ toast('Not enough coins'); SFX.bad(); return; }
    G.gold-=cost; t.spent+=cost; t.level++; SFX.up();
    if(t.level===3 && !t.branch) toast('Pick a path: permanent');
    return;
  }
  if(b.act==='forkA'||b.act==='forkB'){
    const F=TOWERS[t.fam], B=F.forks[b.branch], c0=B.lv[0].cost;
    if(G.gold<c0){ toast('Not enough coins'); SFX.bad(); return; }
    G.gold-=c0; t.spent+=c0; t.branch=b.branch; t.level=4;
    SFX.up(); G.shake=2;
    addFx({type:'ring',x:t.x,y:t.y,r:2,rmax:22,ttl:.5,color:'#ffd452'});
    return;
  }
}
cv.addEventListener('pointerdown',ev=>{
  ev.preventDefault();
  const p=toArt(ev);
  const b=hitBtn(p.x,p.y);
  if(G.screen){ if(b) screenAction(b.act); return; }
  if(b){ if(b.dis){ toast('Not enough coins'); SFX.bad(); } else doAction(b); return; }

  const i=plotAt(p.x,p.y);

  if(G.placing){
    if(PLACEMENT==='open'){
      // tapping a standing tower says so; anywhere else is a build attempt, so
      // the only way out is the cross or re-tapping the dock card
      if(i>=0 && G.plots[i].tower){ toast('Plot taken'); return; }
      const gx=snapTo(p.x), gy=snapTo(p.y);
      if(!placeOK(gx,gy)){
        // leave the red frame standing where they tapped: on a touch screen
        // there is no hover, so the refusal has to be visible somewhere
        G.hoverPos={x:gx,y:gy,ok:false}; G.hoverAge=SEL_GROW;
        toast('No room there'); SFX.bad(); return;
      }
      if(!G.ghost||G.ghost.x!==gx||G.ghost.y!==gy){
        G.ghost={i:-1,x:gx,y:gy,age:0}; G.hoverPos=null; SFX.tick();
      }
      return;
    }
    if(i<0){ cancelPlacing(); return; }          // tapping open ground puts it away
    if(freePlot(i)){
      if(!G.ghost||G.ghost.i!==i){
        const q=G.plots[i]; G.ghost={i,x:q.x,y:q.y,age:0}; SFX.tick();
      }
    } else toast(G.plots[i].tower ? 'Plot taken' : 'Cleared stumps only');
    return;
  }
  if(i<0){ G.selected=null; G.selPlot=-1; return; }
  const p2=G.plots[i];
  if(p2.tower){
    G.selPlot=-1;
    G.selected=(p2.tower===G.selected)?null:p2.tower;
  } else if(p2.blocked){
    G.selected=null;
    G.selPlot=(G.selPlot===i)?-1:i;
  } else { G.selected=null; G.selPlot=-1; }
},{passive:false});

cv.addEventListener('pointermove',ev=>{
  const p=toArt(ev);
  const b=hitBtn(p.x,p.y);
  G.btnHover=b?b.act:null;
  if(b){ G.hover=-1; G.hoverPos=null; return; }
  if(!G.placing){ G.hover=-1; G.hoverPos=null; return; }
  if(PLACEMENT==='open'){
    // the frame grows once, when the tower is armed, then tracks the pointer
    const gx=snapTo(p.x), gy=snapTo(p.y);
    G.hoverPos={x:gx, y:gy, ok:placeOK(gx,gy)};
    return;
  }
  const i=plotAt(p.x,p.y);
  const ok = i>=0 && freePlot(i);
  if(G.hover!==(ok?i:-1)) G.hoverAge=0;
  G.hover = ok ? i : -1;
});
cv.addEventListener('pointerleave',()=>{ G.hover=-1; G.hoverPos=null; G.btnHover=null; });

function placeGhost(){
  if(!G.placing||!G.ghost) return;
  const fam=G.placing, cost=TOWERS[fam].cost;
  let i=G.ghost.i, pl;
  if(PLACEMENT==='open'){
    if(!placeOK(G.ghost.x,G.ghost.y)){ toast('No room there'); SFX.bad(); return; }
    if(G.gold<cost){ toast('Not enough coins'); SFX.bad(); return; }
    pl={x:G.ghost.x, y:G.ghost.y, blocked:false, tower:null};  // the bed is born here
    G.plots.push(pl); i=G.plots.length-1;
  } else {
    pl=G.plots[i];
    if(!freePlot(i)){ toast('No room there'); return; }
    if(G.gold<cost){ toast('Not enough coins'); SFX.bad(); return; }
  }
  G.gold-=cost;
  const t={fam,plot:i,x:pl.x,y:pl.y,level:1,branch:null,cd:0,face:1,bob:Math.random()*6,kick:0,spent:cost};
  G.towers.push(t); pl.tower=t;
  addFx({type:'ring',x:pl.x,y:pl.y,r:2,rmax:14,ttl:.35,color:'#ffd452'});
  SFX.place();
  G.placing=null; G.ghost=null; G.hover=-1; G.hoverPos=null; G.hoverAge=0; G.btnHover=null;
}
function cancelPlacing(){
  G.placing=null; G.ghost=null; G.hover=-1; G.hoverPos=null; G.btnHover=null;
}

/* ======================================================================
   14. UI
   ====================================================================== */
// state of the single action control: paused is checked before idle, so a tab
// that lost focus between waves offers resume before it offers the next wave
function actionState(){
  if(!G.started) return 'pause';
  if(G.paused) return 'resume';
  if(G.phase==='idle') return 'send';
  return 'pause';
}

// what a tower does beyond plain damage, for the plaque's first line
function effects(st){
  const x=[];
  if(st.chain) x.push('CHAIN '+(st.chain+1));
  if(st.stun) x.push('STUN');
  if(st.splash) x.push('SPLASH');
  if(st.slow) x.push('SLOW '+Math.round(st.slow*100)+'%');
  return x.length ? ' '+x.join(' ') : '';
}
function numbers(st){
  return 'DMG '+st.dmg+' RNG '+(st.rng/TILE).toFixed(1)+' '+(st.aura?'AURA':'DPS '+Math.round(st.dmg*st.rate));
}

// The info plaque used to be a DOM panel over the field, and it hid part of
// map 1's bottom loop. It is painted now, in the one spot that is clear of the
// trail on all three maps at every screen shape: the top band between the
// read-outs and the buttons. Measured in v31: two lines fit there, three do
// not fit anywhere on map 3, so every plaque is two lines, and there is no
// room for a tower picture beside them: the tower is lit up on the field.
// Line one says what it is and does, line two gives the numbers.
// A line is a list of segments: [text,colour] or {glyph,colour}.
const PLQ_L=146, PLQ_R=266, PLQ_H=18;
const PLQ_NAME='#ffeedd', PLQ_STAT='#cbb495', PLQ_GOLD='#ffd452', PLQ_SH='#241a10';
function plqTop(){ return -OY+1; }
function plaqueContent(){
  if(G.placing){
    const F=TOWERS[G.placing], st=F.lv[0];
    return {lines:[[[F.name,PLQ_NAME],[effects(st),PLQ_STAT]],
      [{glyph:'coin',col:PLQ_GOLD},[F.cost+' ',PLQ_GOLD],[numbers(st),PLQ_STAT]]]};
  }
  if(G.selPlot>=0 && G.plots[G.selPlot] && G.plots[G.selPlot].blocked){
    return {lines:[[['Overgrown plot',PLQ_NAME]],
      [['Clear the stump: ',PLQ_STAT],{glyph:'coin',col:PLQ_GOLD},[String(CLEAR_COST),PLQ_GOLD]]]};
  }
  const t=G.selected;
  if(!t||!G.towers.includes(t)) return null;
  const F=TOWERS[t.fam];
  if(!t.branch && t.level===3){
    // one line per path, on the same side as its button
    const k=Object.keys(F.forks), A=F.forks[k[0]], B=F.forks[k[1]];
    return {lines:[
      [{glyph:'back',col:PLQ_GOLD},[' '+A.name+': ',PLQ_NAME],[A.desc,PLQ_STAT]],
      [[B.name+': ',PLQ_NAME],[B.desc+' ',PLQ_STAT],{glyph:'play',col:PLQ_GOLD}]
    ]};
  }
  const st=statsOf(t);
  return {lines:[[[nameOf(t),PLQ_NAME],[effects(st),PLQ_STAT]],
    [['LV '+t.level+' ',PLQ_GOLD],[numbers(st),PLQ_STAT]]]};
}
function segW(s){ return s.glyph ? GL[s.glyph][0].length+1 : textW(s[0]); }
function lineW(l){ return l.reduce((w,s)=>w+segW(s),0); }
function drawLine(l,x,y,sh){
  sh=sh||PLQ_SH;
  for(const s of l){
    if(s.glyph) glyph(GL[s.glyph],x,y,s.col,sh);
    else drawText(x,y,s[0],s[1],sh);
    x+=segW(s);
  }
}
function plaqueW(c){ return 7+Math.max.apply(null,c.lines.map(lineW)); }
function drawPlaque(){
  const y=plqTop();
  if(G.toast && G.ui-G.toast.t < TOAST_T){         // a toast takes the plaque's spot
    const age=G.ui-G.toast.t, w=textW(G.toast.msg)+9, h=11;
    const x=Math.round((PLQ_L+PLQ_R-w)/2);
    ctx.globalAlpha=Math.min(1,(TOAST_T-age)/0.18);
    plate(x,y,w,h,'#1f251e','#4b5248');
    drawText(x+4,y+3,G.toast.msg,'#fff6e5','#0e120e');
    ctx.globalAlpha=1;
    return;
  }
  const c=plaqueContent();
  if(!c) return;
  const w=plaqueW(c), x=Math.round((PLQ_L+PLQ_R-w)/2);
  plate(x,y,w,PLQ_H,'#3b2a1b','#6b4a30');
  const tx=x+3;
  drawLine(c.lines[0],tx,y+3);
  if(c.lines[1]) drawLine(c.lines[1],tx,y+10);
}

/* ======================================================================
   15. SCREENS: title, map cleared, lost, won. They used to be DOM text in a
   system font over the field; painted here they share the game's pixel font
   and plates. A screen dims the field and takes every tap while it is up.
   ====================================================================== */
const SC_TITLE='#ffd452', SC_HEAD='#ffeedd', SC_BODY='#cbb495', SC_GOLD='#ffd452';
const SC_SKIN={go:['#4f9d4a','#82d17c','#2c5c2a'], alt:['#3d5f8f','#7aa6dd','#23395a']};
const SC_MAXW=236;                 // body text wraps here, in art px
// words of [text,colour] runs, packed into lines no wider than w; a '\n'
// word starts a new line
function wrapRuns(runs,w){
  const lines=[]; let line=[], lw=0;
  for(const [txt,col] of runs) for(const word of String(txt).split(' ')){
    if(!word) continue;
    if(word==='\n'){ if(line.length) lines.push(line); line=[]; lw=0; continue; }
    const ww=textW(word), sp=line.length?SPACE_W+1:0;
    if(line.length && lw+sp+ww>w){ lines.push(line); line=[]; lw=0; }
    const last=line[line.length-1], lead=line.length?' ':'';
    if(last && last[1]===col) last[0]+=lead+word; else line.push([lead+word,col]);
    lw+=(line.length>1||lead?sp:0)+ww;
  }
  if(line.length) lines.push(line);
  return lines;
}
// same number of lines, but as even as they can be, so no word sits alone
function wrapEven(runs,w){
  const n=wrapRuns(runs,w).length;
  let lo=40, hi=w;
  while(lo<hi){ const m=(lo+hi)>>1; if(wrapRuns(runs,m).length<=n) hi=m; else lo=m+1; }
  return wrapRuns(runs,lo);
}
function screenContent(kind){
  const M=MAPS[G.map-1];
  if(kind==='title') return {
    title:'Sprout Siege', col:SC_TITLE, shade:'#7a4a12',
    body:[['Bugs are marching on the Great Sprout. \n Tap a card, then any open ground to plant. \n Level 3 picks a specialty. GO sends the next wave.',SC_BODY]],
    btns:[{act:'sc_start',label:'Start',skin:'go'}], ver:true };
  if(kind==='rift'){
    const nx=MAPS[G.map], rate=carrotRate(G.map+1);
    const arrive=MAP_BASE_GOLD+rate*G.lives+G.pack, n=G.towers.length;
    return { title:'Plot held', col:SC_TITLE, shade:'#7a4a12',
      head:M.name+' cleared: '+G.lives+' lives carried',
      body:[['You pack up the kit and step through: '+G.lives+' lives at '+rate+
        ' coins each, plus '+G.pack+' salvaged from '+n+' tower'+(n===1?'':'s')+'. You arrive at '+nx.name+' with',SC_BODY],
        [arrive+'.',SC_GOLD]],
      btns:[{act:'sc_next',label:'On to '+nx.name,skin:'go',arrow:true}] };
  }
  if(kind==='dead') return { title:'Patch eaten', col:'#ff7b7b', shade:'#5c1f1f',
      head:M.name+', wave '+Math.max(1,G.wave),
      body:[['The bugs got through. Replant and try a different mix of specialties.',SC_BODY]],
      btns:[{act:'sc_again',label:'Plant again',skin:'go'}] };
  const hp=G.lives;
  const line = hp>=20 ? 'Not one carrot lost.'
             : hp>=13 ? 'Chewed at the edges, still standing.'
             : hp>=6  ? 'More stem than carrot now, but it held.'
             :          'Down to the last row. That was close.';
  return { title:'Garden held', col:SC_TITLE, shade:'#7a4a12',
    head:'All '+MAPS.length+' plots held, '+hp+' lives left',
    body:[[line+' Keep going and the swarm stops holding back.',SC_BODY]],
    btns:[{act:'sc_endless',label:'Endless mode',skin:'go'},{act:'sc_again',label:'Start over',skin:'alt'}] };
}
const SC_T=3, BTN_H=13;            // heading scale, button height
function drawScreen(kind){
  const c=screenContent(kind);
  ctx.fillStyle='rgba(14,18,14,.82)'; ctx.fillRect(-OX,-OY,ARTW,ARTH);
  const body=wrapEven(c.body,SC_MAXW);
  const btnW=b=>textW(b.label)+12+(b.arrow?6:0);
  const rowW=c.btns.reduce((w,b)=>w+btnW(b),0)+(c.btns.length-1)*6;
  const tw=textW(c.title,SC_T);
  const innerW=Math.max(tw, c.head?textW(c.head):0, ...body.map(lineW), rowW);
  const h=5*SC_T+(c.head?12:0)+9+body.length*7+6+BTN_H;
  const pw=innerW+20, ph=h+18;
  const px=Math.round((W-pw)/2), py=Math.round((H-ph)/2);
  plate(px,py,pw,ph,'#3b2a1b','#6b4a30');
  let y=py+8;
  drawText(Math.round((W-tw)/2),y,c.title,c.col,c.shade,SC_T);
  y+=5*SC_T+6;
  if(c.head){ drawText(Math.round((W-textW(c.head))/2),y,c.head,SC_HEAD,PLQ_SH); y+=12; } else y+=3;
  for(const l of body){ drawLine(l,Math.round((W-lineW(l))/2),y); y+=7; }
  y+=6;
  const out=[]; let bx=Math.round((W-rowW)/2);
  for(const b of c.btns){
    const w=btnW(b), sk=SC_SKIN[b.skin], press=G.btnHover===b.act?1:0;
    plate(bx,y+press,w,BTN_H,sk[0],sk[1]);
    drawText(bx+6,y+4+press,b.label,'#ffffff',sk[2]);
    if(b.arrow) glyph(GL.play,bx+w-9,y+4+press,'#ffffff',sk[2]);
    out.push({act:b.act,x:bx,y,w,h:BTN_H});
    bx+=w+6;
  }
  if(c.ver) drawText(W+OX-3-textW(VERSION),H+OY-8,VERSION,'#6f7a6c');
  return out;
}
function screenAction(act){
  if(act==='sc_start'){ actx(); G.started=true; G.paused=false; G.phase='idle'; }
  else if(act==='sc_next'){ loadMap(G.map+1); G.paused=false; SFX.wave(); }
  else if(act==='sc_again'){ reset(); }
  else if(act==='sc_endless'){ G.endless=true; G.phase='idle'; G.paused=false; }
  else return;
  G.screen=null; G.btnHover=null;
}
function showOver(kind){
  G.paused=true; G.screen=kind; G.selected=null; G.placing=null; G.ghost=null;
  if(kind==='rift'||kind==='won') SFX.up(); else SFX.bad();
}
function reset(){
  G.lives=MAX_LIVES; G.endless=false; G.pack=0;
  loadMap(1);
  G.paused=false;
}

document.addEventListener('visibilitychange',()=>{ if(document.hidden){ G.paused=true; } });
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

})();
</script>
